{% extends "padre.html" %}

{% block content %}
<style>
.clientes-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start; 
}

.left { width: 60%; } 
.right { width: 40%; }

.search {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.search input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
    transition: .2s;
    border: 2px solid transparent;
}

.vehiculo {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto; 
    gap: 5px;
    background: #eee;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    align-items: center;
}

.vehiculo button {
    background: #ff4d4d;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    padding: 5px 8px;
}

.card:hover { transform: scale(1.01); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
.card.active { border-color: #4CAF50; background: #f0fff0; }

.tag { padding: 5px 10px; border-radius: 6px; font-size: 12px; }
.activo { background: #d4edda; color: #155724; }

.form-box {
    background: #f9fafb;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    position: sticky; 
    top: 20px;
}

.form-box h3 { margin-bottom: 15px; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
.form-box input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; }

/* ESTILOS DE BOTONES ACTUALIZADOS */
.btn { 
    background: #4CAF50; /* Verde por defecto para Guardar */
    color: white; 
    border: none; 
    padding: 12px; 
    width: 100%; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: bold; 
    margin-bottom: 10px; 
    transition: 0.3s;
}
.btn:hover { background: #45a049; }

.btn-secondary { 
    background: #0d1b5e; /* Azul oscuro para botones secundarios */
}
.btn-secondary:hover { background: #1a2a7a; }

.btn-eliminar { 
    background: #dc3545; /* Rojo para advertencia/eliminar */
}
.btn-eliminar:hover { background: #c82333; }
</style>

<div class="clientes-layout">

    <div class="left">
        <div class="search">
            <input type="text" id="buscador" placeholder="Buscar cliente...">
        </div>

        <div id="contenedor-cards">
            {% for cliente in clientes %}
            <div class="card"
    onclick="cargarCliente(
        '{{ cliente.cliente_id }}',
        '{{ cliente.nombre }}',
        '{{ cliente.telefono }}',
        '{{ cliente.rfc }}',
        '{{ cliente.email }}',
        '{{ cliente.tipo_cliente_id }}',
        this
    )">

    <div>
        <strong>{{ cliente.nombre }}</strong><br>
        <small>
            Vehículos: {{ cliente.matriculas if cliente.matriculas else 'Sin vehículos' }}
        </small>
    </div>

    <div class="tag activo">Activo</div>
</div>
            {% endfor %}
        </div>
    </div>

    <div class="right">
        <div class="form-box">
            <h3 id="titulo">Registrar cliente</h3>

            <form method="POST" action="/procesar_cliente" onsubmit="return validar()">
                <input type="hidden" id="cliente_id" name="cliente_id">

                <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                <input type="text" id="telefono" name="telefono" placeholder="Teléfono" required>
                <input type="text" id="rfc" name="rfc" placeholder="RFC">
                <input type="email" id="email" name="email" placeholder="Correo">
                <select name="tipo_cliente_id" id="tipo_cliente_id" required>
                    <option value="1">De paso</option>
                    <option value="2">Frecuente</option>
                </select>

                <hr>

                <div id="vehiculos-container">
                    <div class="vehiculo">
                        <input type="text" name="matricula[]" placeholder="Matrícula">
                        <input type="text" name="modelo[]" placeholder="Modelo">
                        <input type="text" name="color[]" placeholder="Color">
                    </div>
                </div>

                <button type="button" class="btn btn-secondary" onclick="agregarVehiculo()">
                    + Agregar vehículo
                </button>

                <button type="submit" class="btn" id="btnGuardar">Guardar cliente</button>

                <!-- Se cambió a btn-eliminar -->
                <button type="button" class="btn btn-eliminar" onclick="eliminarCliente()">
                    Eliminar cliente
                </button>
            </form>

            <button type="button" class="btn btn-secondary" onclick="limpiarForm()">
                Nuevo cliente
            </button>
        </div>
    </div>

</div>

<script>
function cargarCliente(id, nombre, telefono, rfc, email, tipo_cliente_id, element) {

    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    element.classList.add('active');

    document.getElementById('cliente_id').value = id;
    document.getElementById('nombre').value = nombre || "";
    document.getElementById('telefono').value = telefono || "";
    document.getElementById('rfc').value = rfc || "";
    document.getElementById('email').value = email || "";
    document.getElementById('tipo_cliente_id').value = tipo_cliente_id ? tipo_cliente_id : "1";

    document.getElementById('titulo').innerText = "Editar cliente";
    document.getElementById('btnGuardar').innerText = "Actualizar cliente";

    fetch('/obtener_vehiculos/' + id)
    .then(res => res.json())
    .then(data => {

        const container = document.getElementById('vehiculos-container');
        container.innerHTML = "";

        if (data.length === 0) {
            agregarVehiculo();
            return;
        }

        data.forEach(v => {
            const div = document.createElement('div');
            div.classList.add('vehiculo');

            div.innerHTML = `
                <input type="text" name="matricula[]" value="${v.matricula}">
                <input type="text" name="modelo[]" value="${v.modelo}">
                <input type="text" name="color[]" value="${v.color}">
                <button type="button" onclick="this.parentElement.remove()">❌</button>
            `;

            container.appendChild(div);
        });

    });
}

function agregarVehiculo() {
    const container = document.getElementById('vehiculos-container');

    const div = document.createElement('div');
    div.classList.add('vehiculo');

    div.innerHTML = `
        <input type="text" name="matricula[]" placeholder="Matrícula">
        <input type="text" name="modelo[]" placeholder="Modelo">
        <input type="text" name="color[]" placeholder="Color">
        <button type="button" onclick="this.parentElement.remove()">❌</button>
    `;

    container.appendChild(div);
}

function eliminarCliente() {
    let id = document.getElementById('cliente_id').value;

    if (!id) {
        alert("Selecciona un cliente primero");
        return;
    }

    if (confirm("¿Estás seguro de que deseas eliminar este cliente? Se borrarán también sus vehículos.")) {
        window.location.href = "/eliminar_cliente/" + id;
    }
}

function limpiarForm() {
    document.getElementById('cliente_id').value = "";
    document.getElementById('nombre').value = "";
    document.getElementById('telefono').value = "";
    document.getElementById('rfc').value = "";
    document.getElementById('email').value = "";

    document.getElementById('vehiculos-container').innerHTML = `
        <div class="vehiculo">
            <input type="text" name="matricula[]" placeholder="Matrícula">
            <input type="text" name="modelo[]" placeholder="Modelo">
            <input type="text" name="color[]" placeholder="Color">
        </div>
    `;

    document.getElementById('titulo').innerText = "Registrar cliente";
    document.getElementById('btnGuardar').innerText = "Guardar cliente";

    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
}

function validar() {
    const nombre = document.getElementById('nombre').value;
    if (nombre.trim() === "") {
        alert("El nombre es obligatorio");
        return false;
    }
    return true;
}

document.getElementById('buscador').addEventListener('keyup', function() {
    let filtro = this.value.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
        let texto = card.innerText.toLowerCase();
        card.style.display = texto.includes(filtro) ? 'flex' : 'none';
    });
});
</script>

{% endblock %}
