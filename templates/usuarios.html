{% extends "padre.html" %}

{% block content %}
<style>
/* --- ESTILOS EXCLUSIVOS DE ESTA VISTA --- */
/* LAYOUT */
.usuarios-layout {
    display: flex;
    gap: 20px;
}
.left { width: 65%; }
.right { width: 35%; }

/* SWITCH */
.switch {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}
.switch button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e0e0e0;
}
.switch button.active {
    background: #4CAF50;
    color: white;
}

/* SEARCH */
.search {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}
.search input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* CARD */
.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
    transition: .2s;
}
.card:hover {
    transform: scale(1.01);
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
}

/* STATUS */
.tag {
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
}
.activo { background: #d4edda; color: #155724; }
.inactivo { background: #f8d7da; color: #721c24; }

/* FORM */
.form {
    background: #f9fafb;
    padding: 20px;
    border-radius: 12px;
}
.form h3 { margin-bottom: 10px; }
.form input, .form select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
.form input:focus {
    border-color: #4CAF50;
    outline: none;
}
.btn {
    background: #a6d96a;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
.btn:hover { background: #8cc657; }
</style>

<div class="usuarios-layout">

    <div class="left">

        <div class="switch">
            <button id="btnClientes" class="active" onclick="cambiarTipo('clientes')">Clientes</button>
            <button id="btnCobradores" onclick="cambiarTipo('cobradores')">Cobradores</button>
        </div>

        <div class="search">
            <input type="text" placeholder="Buscar por nombre o matrícula...">
        </div>

        <div id="lista">

            <div class="card cliente">
                <div>
                    <strong>María López</strong><br>
                    Matrícula: ABC-123
                </div>
                <div class="tag activo">Activo</div>
            </div>

            <div class="card cliente">
                <div>
                    <strong>Juan Pérez</strong><br>
                    Matrícula: DEF-456
                </div>
                <div class="tag activo">Activo</div>
            </div>

            <div class="card cobrador" style="display:none;">
                <div>
                    <strong>Carlos Admin</strong><br>
                    Usuario: carlos01
                </div>
                <div class="tag activo">Activo</div>
            </div>

            <div class="card cobrador" style="display:none;">
                <div>
                    <strong>Laura Caja</strong><br>
                    Usuario: laura02
                </div>
                <div class="tag inactivo">Inactivo</div>
            </div>

        </div>

    </div>

    <div class="right">
        <div class="form" id="formulario">

            <h3 id="tituloForm">Registrar cliente</h3>

            <div id="formCliente">
                <input type="text" placeholder="Matrícula">
                <input type="text" placeholder="Nombre">
                <input type="text" placeholder="Teléfono">
                <input type="email" placeholder="Correo Electrónico">
                <input type="text" placeholder="RFC">
            </div>

            <div id="formCobrador" style="display:none;">
                <input type="text" placeholder="Nombre">
                <input type="email" placeholder="Correo Electrónico">
                <input type="text" placeholder="Teléfono">
                <input type="text" placeholder="Usuario">
                <input type="password" placeholder="Contraseña">
                <select>
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>

            <button class="btn">Guardar</button>

        </div>
    </div>

</div>

<script>
function cambiarTipo(tipo) {
    const clientes = document.querySelectorAll('.cliente');
    const cobradores = document.querySelectorAll('.cobrador');

    const btnC = document.getElementById('btnClientes');
    const btnCo = document.getElementById('btnCobradores');

    if (tipo === 'clientes') {
        clientes.forEach(e => e.style.display = 'flex');
        cobradores.forEach(e => e.style.display = 'none');

        document.getElementById('formCliente').style.display = 'block';
        document.getElementById('formCobrador').style.display = 'none';
        document.getElementById('tituloForm').innerText = "Registrar cliente";

        btnC.classList.add('active');
        btnCo.classList.remove('active');
    } else {
        clientes.forEach(e => e.style.display = 'none');
        cobradores.forEach(e => e.style.display = 'flex');

        document.getElementById('formCliente').style.display = 'none';
        document.getElementById('formCobrador').style.display = 'block';
        document.getElementById('tituloForm').innerText = "Registrar cobrador";

        btnCo.classList.add('active');
        btnC.classList.remove('active');
    }
}
</script>
{% endblock %}
