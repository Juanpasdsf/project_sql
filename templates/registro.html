{% extends "auth.html" %}

{% block title %}Registrar Usuario{% endblock %}

{% block content %}

<h2 style="text-align:center; margin-bottom:15px; color:#0d1b5e;">Crear cuenta</h2>

{% if error %}
<div class="error">
    {{ error }}
</div>
{% endif %}

<form method="POST" action="/procesar_registro">

    <input type="text" name="nombre" placeholder="Nombre completo" required>
    
    <input type="text" name="usuario" placeholder="Usuario" required>
    
    <input type="password" name="password" placeholder="Contraseña" required>

    <button type="submit" style="margin-bottom: 15px;">Registrarse</button>

</form>

<div style="text-align:center;">
    <a href="/" style="color:#0d1b5e; text-decoration:none; font-size:14px; font-weight:bold; transition: 0.2s;">
        Volver al login
    </a>
</div>

{% endblock %}
